<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | HavenGH</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #064e3b, #0f766e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 430px;
        }

        .forgot-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .logo h1 {
            color: #064e3b;
            font-size: 30px;
            letter-spacing: 1px;
        }

        .gold-line {
            width: 55px;
            height: 3px;
            background: #d4af37;
            margin: 8px auto 25px;
            border-radius: 5px;
        }

        h2 {
            text-align: center;
            color: #064e3b;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #064e3b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #053c2e;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: #064e3b;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-login a:hover {
            color: #d4af37;
        }

        @media (max-width: 480px) {
            .forgot-card {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="forgot-card">

               <div class="logo">
                <h1>HavenGH</h1>
            </div> 

            <div class="gold-line"></div>

            <h2>Forgot Password?</h2>

            <p class="description">
                Enter the email address associated with your HavenGH account.
                If the account exists, we'll help you reset your password.
            </p>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Send Reset Link
                </button>

            </form>

            <div id="message" class="message"></div>

            <div class="back-login">
                <a href="login.html">
                    ← Back to Agent/Landlord Login
                </a>
            </div>

        </div>

    </div>

    <script>
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const submitBtn = document.getElementById("submitBtn");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                showMessage("Please enter your email address.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending...";

            message.className = "message";
            message.textContent = "";

            try {

                /*
                 * BACKEND CONNECTION
                 *
                 * We will connect this to the HavenGH API
                 * after creating the password-reset endpoint.
                 */

                // Temporary frontend test
                await new Promise(resolve => setTimeout(resolve, 800));

                showMessage(
                    "If an account with that email exists, password reset instructions will be sent.",
                    "success"
                );

                emailInput.value = "";

            } catch (error) {

                console.error("Forgot password error:", error);

                showMessage(
                    "Something went wrong. Please try again later.",
                    "error"
                );

            } finally {

                submitBtn.disabled = false;
                submitBtn.textContent = "Send Reset Link";
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }
    </script>

</body>
</html>
