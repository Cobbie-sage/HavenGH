<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Reset your HavenGH account password securely.">

    <title>Reset Password | HavenGH</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #064e3b,
                    #0f766e
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 430px;
        }

        .reset-card {
            background: #ffffff;

            border-radius: 18px;

            padding: 40px 35px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.2);
        }

        /* ============================================================
           LOGO
        ============================================================ */

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 70px;
            height: 70px;

            object-fit: contain;
            display: block;

            margin: 0 auto 10px;
        }

        .logo h1 {
            color: #064e3b;

            font-size: 30px;

            letter-spacing: 1px;
        }

        .gold-line {
            width: 55px;
            height: 3px;

            background: #d4af37;

            margin: 8px auto 25px;

            border-radius: 5px;
        }

        /* ============================================================
           HEADINGS
        ============================================================ */

        h2 {
            text-align: center;

            color: #064e3b;

            margin-bottom: 10px;

            font-size: 24px;
        }

        .description {
            text-align: center;

            color: #666;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        /* ============================================================
           FORM
        ============================================================ */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: 600;

            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #0f766e;

            box-shadow:
                0 0 0 3px
                rgba(15, 118, 110, 0.12);
        }

        input:disabled {
            background: #f3f4f6;
            cursor: not-allowed;
        }

        /* ============================================================
           HIDDEN TOKEN
        ============================================================ */

        .hidden-token {
            display: none;
        }

        /* ============================================================
           SUBMIT BUTTON
        ============================================================ */

        .submit-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #064e3b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-btn:hover {
            background: #053c2e;
        }

        .submit-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }

        /* ============================================================
           MESSAGE
        ============================================================ */

        .message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;

            line-height: 1.5;
        }

        .message.success {
            display: block;

            background: #ecfdf5;

            color: #065f46;

            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;

            background: #fef2f2;

            color: #991b1b;

            border: 1px solid #fecaca;
        }

        /* ============================================================
           BACK TO LOGIN
        ============================================================ */

        .back-login {
            text-align: center;

            margin-top: 25px;
        }

        .back-login a {
            color: #064e3b;

            text-decoration: none;

            font-weight: 600;

            font-size: 14px;
        }

        .back-login a:hover {
            color: #d4af37;
        }

        /* ============================================================
           MOBILE
        ============================================================ */

        @media (max-width: 480px) {

            .reset-card {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

<div class="reset-container">

    <div class="reset-card">

        <!-- =====================================================
             LOGO
        ===================================================== -->

        <div class="logo">

            <img
                src="havengh logo.jpeg"
                alt="HavenGH Logo"
            >

            <h1>
                HavenGH
            </h1>

        </div>

        <div class="gold-line"></div>


        <!-- =====================================================
             TITLE
        ===================================================== -->

        <h2>
            Reset Password
        </h2>

        <p class="description">
            Choose a new password for your HavenGH account.
        </p>


        <!-- =====================================================
             FORM
        ===================================================== -->

        <form
            id="resetPasswordForm"
            novalidate
        >

            <!--
                The reset token is received from the URL fragment:

                reset-password.html#token=...

                It is stored in this hidden field.
            -->

            <input
                type="hidden"
                id="token"
                name="token"
            >


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Reset Password
            </button>

        </form>


        <!-- =====================================================
             STATUS MESSAGE
        ===================================================== -->

        <div
            id="message"
            class="message"
            role="alert"
            aria-live="polite"
        ></div>


        <!-- =====================================================
             BACK TO LOGIN
        ===================================================== -->

        <div class="back-login">

            <a
                href="index.html"
                id="backLogin"
            >
                ← Back to Home
            </a>

        </div>

    </div>

</div>


<script>

"use strict";


console.log(
    "HavenGH Reset Password JavaScript is running"
);


/* ============================================================
   API
============================================================ */

const API_BASE_URL =
    "https://havenghapi-production.up.railway.app";


/* ============================================================
   READ URL FRAGMENT
============================================================

   Backend creates:

   reset-password.html#token=ABC123

   NOT:

   reset-password.html?token=ABC123

============================================================ */

const hash =
    window.location.hash.substring(1);

const hashParams =
    new URLSearchParams(hash);


/* ============================================================
   RESET TOKEN
============================================================ */

const urlToken =
    hashParams.get("token");


/* ============================================================
   ACCOUNT TYPE
============================================================

   The reset backend currently creates only:

   #token=...

   So tenant is the default.

   We also support:

   #token=...&type=owner

   if you later decide to include account type.
============================================================ */

const accountType =
    hashParams.get("type") === "owner"
        ? "owner"
        : "tenant";


console.log(
    "Reset account type:",
    accountType
);

console.log(
    "Reset token:",
    urlToken
        ? "Token received"
        : "No token found"
);


/* ============================================================
   ELEMENTS
============================================================ */

const form =
    document.getElementById(
        "resetPasswordForm"
    );

const tokenInput =
    document.getElementById(
        "token"
    );

const newPasswordInput =
    document.getElementById(
        "newPassword"
    );

const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const message =
    document.getElementById(
        "message"
    );

const backLogin =
    document.getElementById(
        "backLogin"
    );


/* ============================================================
   BACK TO LOGIN
============================================================ */

if (backLogin) {

    if (accountType === "owner") {

        backLogin.href =
            "login.html";

        backLogin.textContent =
            "← Back to Agent/Landlord Login";

    } else {

        backLogin.href =
            "tenant-login.html";

        backLogin.textContent =
            "← Back to Tenant Login";

    }

}


/* ============================================================
   CHECK REQUIRED ELEMENTS
============================================================ */

if (
    !form ||
    !tokenInput ||
    !newPasswordInput ||
    !confirmPasswordInput ||
    !submitBtn ||
    !message
) {

    console.error(
        "HavenGH Reset Password: Required HTML elements are missing."
    );

}


/* ============================================================
   AUTO-FILL TOKEN
============================================================ */

if (urlToken) {

    tokenInput.value =
        urlToken;

    console.log(
        "Reset token automatically loaded."
    );

} else {

    showMessage(
        "Your password reset link is invalid or missing. Please request a new reset link.",
        "error"
    );

    submitBtn.disabled =
        true;

}


/* ============================================================
   SHOW MESSAGE
============================================================ */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";

}


/* ============================================================
   RESET PASSWORD
============================================================ */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        console.log(
            "Reset password form submitted."
        );


        /* ====================================================
           GET VALUES
        ==================================================== */

        const token =
            tokenInput.value.trim();

        const newPassword =
            newPasswordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        /* ====================================================
           VALIDATION
        ==================================================== */

        if (!token) {

            showMessage(
                "Your password reset link is invalid or missing. Please request a new reset link.",
                "error"
            );

            return;
        }


        if (!newPassword) {

            showMessage(
                "Please enter your new password.",
                "error"
            );

            newPasswordInput.focus();

            return;
        }


        if (newPassword.length < 8) {

            showMessage(
                "Password must be at least 8 characters long.",
                "error"
            );

            newPasswordInput.focus();

            return;
        }


        if (!confirmPassword) {

            showMessage(
                "Please confirm your new password.",
                "error"
            );

            confirmPasswordInput.focus();

            return;
        }


        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            confirmPasswordInput.focus();

            return;
        }


        /* ====================================================
           LOADING
        ==================================================== */

        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "Resetting...";


        message.className =
            "message";

        message.textContent =
            "";

        message.style.display =
            "none";


        try {

            const endpoint =
                `${API_BASE_URL}/api/Auth/reset-password`;


            /* =================================================
               API REQUEST
            ================================================= */

            const response =
                await fetch(
                    endpoint,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                token:
                                    token,

                                newPassword:
                                    newPassword
                            })
                    }
                );


            console.log(
                "Reset password API status:",
                response.status
            );


            /* =================================================
               READ RESPONSE
            ================================================= */

            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            console.log(
                "Reset password API response:",
                data
            );


            /* =================================================
               API ERROR
            ================================================= */

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to reset your password."
                );

            }


            /* =================================================
               SUCCESS
            ================================================= */

            showMessage(
                data.message ||
                "Password reset successfully.",
                "success"
            );


            console.log(
                "Password reset successful."
            );


            /* =================================================
               CLEAR PASSWORD FIELDS
            ================================================= */

            newPasswordInput.value =
                "";

            confirmPasswordInput.value =
                "";


            /* =================================================
               DISABLE FORM
            ================================================= */

            tokenInput.disabled =
                true;

            newPasswordInput.disabled =
                true;

            confirmPasswordInput.disabled =
                true;

            submitBtn.disabled =
                true;


            /* =================================================
               REMOVE TOKEN FROM URL
            =================================================

               The token is removed from the browser address
               after a successful password reset.
            ================================================= */

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );


            /* =================================================
               REDIRECT TO LOGIN
            ================================================= */

            setTimeout(
                function () {

                    if (
                        accountType ===
                        "owner"
                    ) {

                        console.log(
                            "Redirecting to Agent/Landlord login."
                        );

                        window.location.href =
                            "login.html";

                    } else {

                        console.log(
                            "Redirecting to Tenant login."
                        );

                        window.location.href =
                            "tenant-login.html";

                    }

                },
                2000
            );


        }
        catch (error) {

            console.error(
                "Reset password error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to connect to the HavenGH API. Please try again.",
                "error"
            );


            /* =================================================
               RE-ENABLE AFTER ERROR
            ================================================= */

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Reset Password";

        }

    }
);

</script>

</body>

</html>
