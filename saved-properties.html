<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Properties | HavenGH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="dashboard-sidebar">

        <a href="index.html" class="logo">
            <span class="logo-main">Haven</span><span class="logo-accent">GH</span>
        </a>

        <nav class="dashboard-nav">

            <a href="tenant-dashboard.html">
                Dashboard
            </a>

            <a href="properties.html">
                Find a Home
            </a>

            <a href="saved-properties.html" class="active">
                Saved Properties
            </a>

            <a href="tenant-request.html">
                My Requests
            </a>

            <a href="tenant-messages.html">
                Messages
            </a>

            <a href="tenant-profile.html">
                My Profile
            </a>

            <a href="tenant-settings.html">

            </a>

        </nav>

        <a href="index.html" class="dashboard-logout">
            Log out
        </a>

    </aside>


    <main class="dashboard-main">

        <button class="dashboard-menu-button" type="button">
            ☰
        </button>


        <header class="dashboard-header">

            <p class="dashboard-label">
                Tenant Dashboard
            </p>

            <h1>
                Saved Properties
            </h1>

            <p>

            </p>

        <section class="dashboard-section">

            <div

                id="saved-properties">

            </div>

            <div
                class="empty-state"
                id="saved-empty">

                <h3>

                </h3>

                <p>

                </p>

                <a href="properties.html" class="btn btn-dark">

    <script src="saved-properties.js"></script>
