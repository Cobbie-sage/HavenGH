<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | HavenGH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="dashboard-sidebar">
        <a href="havengh logo.jpeg" class="logo">
            <span class="logo-main">Haven</span><span class="logo-accent">GH</span>
        </a>
        <nav class="dashboard-nav">
            <a href="tenant-dashboard.html">
                Dashboard
            </a>
            <a href="properties.html">
                Find a Home
            </a>
            <a href="saved-properties.html">
                Saved Properties
            </a>
            <a href="tenant-request.html">
                My Requests
            </a>
            <a href="tenant-messages.html">
                Messages
            </a>
            <a href="tenant-profile.html" class="active">
                My Profile
            </a>
            <a href="tenant-settings.html">
                Settings
            </a>
        </nav>
        <a href="index.html" class="dashboard-logout">
            Log out
        </a>
    </aside>
    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="dashboard-main">
        <button
            class="dashboard-menu-button"
            type="button">
            ☰
        </button>
        <!-- HEADER -->
        <header class="dashboard-header">
            <p class="dashboard-label">
                Tenant Dashboard
            </p>
            <h1>
                My Profile
            </h1>
            <p>
                Manage your personal information.
            </p>
        </header>
        <!-- =========================
             PROFILE
        ========================== -->
        <section class="dashboard-section">
            <!-- PROFILE SUMMARY -->
            <div class="profile-card">
                <div class="profile-avatar">
                    👤
                </div>
                <div class="profile-info">
                    <h2 id="profile-name">
                        Tenant Name
                    </h2>
                    <p id="profile-email">
                        tenant@example.com
                    </p>
                    <p id="profile-phone">
                        +233 XX XXX XXXX
                    </p>
                </div>
            </div>
            <!-- PERSONAL INFORMATION -->
            <div class="profile-form-card">
                <h2>
                    Personal Information
                </h2>
                <form id="tenant-profile-form">
                    <!-- FULL NAME -->
                    <div class="form-field">
                        <label for="tenant-name">
                            Full Name
                        </label>
                        <input
                            type="text"
                            id="tenant-name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                    <!-- EMAIL -->
                    <div class="form-field">
                        <label for="tenant-email">
                            Email Address
                        </label>
                        <input
                            type="email"
                            id="tenant-email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <!-- PHONE -->
                    <div class="form-field">
                        <label for="tenant-phone">
                            Phone Number
                        </label>
                        <input
                            type="tel"
                            id="tenant-phone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>
                    <button
                        type="submit"
                        class="btn btn-dark">
                        Save Changes
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
    <!-- =========================
         PROFILE SCRIPT
    ========================== -->
   <script src="tenant-profile.js"></script>
    
</body>
</html>
